name: Crookcooked
options:
  bundleIdPrefix: app.crookcooked
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  CrookcookedCore:
    type: framework
    platform: [macOS, iOS]
    sources:
      - Sources/CrookcookedCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crookcooked.core
        GENERATE_INFOPLIST_FILE: YES
  CrookcookedMac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac
    dependencies:
      - target: CrookcookedCore_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crookcooked.mac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/CrookcookedMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_NSCameraUsageDescription: crookcooked uses the camera while armed to detect scene changes and record evidence after an alert.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  CrookcookedPhone:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
    dependencies:
      - target: CrookcookedCore_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crookcooked.phone
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/CrookcookedPhone.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: crookcooked uses the camera once, to scan the pairing code shown on your Mac.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  CrookcookedMac:
    build:
      targets:
        CrookcookedMac: all
    run:
      config: Debug
  CrookcookedPhone:
    build:
      targets:
        CrookcookedPhone: all
    run:
      config: Debug
