name: Feature request
description: Suggest a focused product improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and false-alarm impact
      description: Explain any effect on permissions, evidence, noise, arming, or disarming.
