name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          ./scripts/package-mac-release.sh
      - name: Publish release
        # Third-party action with write access: pinned to the v3.0.3 commit.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          generate_release_notes: true
          files: |
            dist/crookcooked-mac.zip
            dist/crookcooked-mac.zip.sha256
